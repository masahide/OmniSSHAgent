name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l cmd internal)
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Error "gofmt required: $_" }
            throw "gofmt check failed"
          }
          go vet ./...
          go test ./...
          ./scripts/test-installer.ps1
      - name: Build release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $commit = "${{ github.sha }}"
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-H=windowsgui -X github.com/masahide/OmniSSHAgent/internal/cli.Version=$version -X github.com/masahide/OmniSSHAgent/internal/cli.Commit=$commit -X github.com/masahide/OmniSSHAgent/internal/cli.BuildTime=$buildTime"
          foreach ($arch in @("amd64", "arm64")) {
            $asset = "OmniSSHAgent-windows-$arch.exe"
            $env:GOOS = "windows"
            $env:GOARCH = $arch
            go build -trimpath -ldflags="$ldflags" -o $asset ./cmd/omnisshagent
            if ($LASTEXITCODE -ne 0) {
              throw "release build failed for windows/$arch"
            }
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
          }
          Remove-Item Env:GOOS -ErrorAction SilentlyContinue
          Remove-Item Env:GOARCH -ErrorAction SilentlyContinue
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            OmniSSHAgent-windows-amd64.exe `
            OmniSSHAgent-windows-amd64.exe.sha256 `
            OmniSSHAgent-windows-arm64.exe `
            OmniSSHAgent-windows-arm64.exe.sha256 `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes
